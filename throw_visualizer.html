<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SF6 投げ抜け・シミー攻防シミュレータ</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0b132b;
            --bg-secondary: #1c2541;
            --bg-tertiary: #3a506b;
            --bg-hover: #486581;
            --border: rgba(255, 255, 255, 0.08);
            --border-focus: #5bc0be;
            --text-primary: #f1f5f9;
            --text-secondary: #cbd5e1;
            --text-muted: #94a3b8;
            --accent: #5bc0be;
            --accent-glow: rgba(91, 192, 190, 0.15);

            --color-startup: #34d399;     /* 発生: エメラルドグリーン */
            --color-active: #f43f5e;      /* 攻撃判定: 鮮やかなピンク/レッド */
            --color-recovery: #3b82f6;    /* 硬直/空振り: 鮮やかなブルー */
            --color-guard: #f59e0b;       /* ガード: 明るいオレンジ/イエロー */
            --color-tech-window: #c084fc;  /* 投げ抜け猶予/無敵: パープル */
            --color-shimmy: #94a3b8;      /* シミー: 灰 */
            --color-punish: #dc2626;      /* 被弾・パニカン: 赤 */
            --color-whiff: #ec4899;       /* 投げ空振り隙: ピンク */
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            padding: 16px;
            line-height: 1.5;
            -webkit-text-size-adjust: 100%;
        }

        /* カスタムスクロールバー */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg-primary);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--bg-tertiary);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--bg-hover);
        }

        /* ヘッダー */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 12px;
            margin-bottom: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
        }
        .header-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .header-left h1 {
            font-size: 16px;
            font-weight: 800;
            letter-spacing: 0.5px;
            margin: 0;
        }

        /* ボタン */
        .btn {
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            color: var(--text-primary);
            padding: 6px 12px;
            font-size: 11px;
            font-weight: 700;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            text-decoration: none;
        }
        .btn:hover {
            background: var(--bg-hover);
            border-color: var(--accent);
            color: var(--accent);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        /* コントロールパネル */
        .controls-panel {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            padding: 16px;
            border-radius: 12px;
            margin-bottom: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
        }

        .controls-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 16px;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .control-group label {
            font-size: 11px;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .control-group label span {
            color: var(--accent);
            font-weight: bold;
        }
        .control-group label small {
            font-size: 10px;
            text-transform: none;
            color: var(--text-muted);
            font-weight: normal;
        }

        .select-input {
            width: 100%;
            background: var(--bg-primary);
            border: 1px solid var(--border);
            color: var(--text-primary);
            padding: 10px 12px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 500;
            outline: none;
            transition: all 0.2s ease;
            appearance: none;
            -webkit-appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2394a3b8' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 12px center;
            background-size: 14px;
        }
        .select-input:focus {
            border-color: var(--border-focus);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }

        /* レンジスライダーのスタイル */
        input[type="range"] {
            -webkit-appearance: none;
            width: 100%;
            height: 8px;
            background: var(--bg-primary);
            border-radius: 4px;
            outline: none;
            border: 1px solid var(--border);
            margin: 8px 0;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: var(--accent);
            cursor: pointer;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
            border: 2px solid var(--bg-secondary);
            transition: transform 0.1s ease, background-color 0.2s;
        }
        input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.15);
            background: var(--text-primary);
        }

        /* タイムラインコンテナ */
        .timeline-container {
            overflow-x: auto;
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
        }

        .timeline-grid {
            display: grid;
            grid-template-columns: 80px repeat(40, 26px);
            gap: 3px;
            align-items: center;
            min-width: 1140px; /* 横スクロールが滑らかになるように最低幅を保証 */
        }

        .row-header {
            font-size: 11px;
            font-weight: 700;
            text-align: right;
            padding-right: 10px;
            color: var(--text-secondary);
            letter-spacing: 0.5px;
        }

        .frame-header {
            font-size: 9px;
            font-weight: 700;
            color: var(--text-muted);
            text-align: center;
        }

        .cell {
            height: 26px;
            border-radius: 4px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.02);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            font-weight: 800;
            color: #ffffff;
            position: relative;
            user-select: none;
        }

        .cell:hover::after {
            content: attr(data-tooltip);
            position: absolute;
            bottom: 110%;
            left: 50%;
            transform: translateX(-50%);
            background: #000;
            color: #fff;
            padding: 4px 8px;
            border-radius: 4px;
            white-space: nowrap;
            z-index: 10;
            pointer-events: none;
            border: 1px solid var(--border);
            font-size: 10px;
        }

        /* 状態カラー */
        .atk-throw-start { background: var(--color-startup); color: #0b132b; }
        .atk-throw-active { background: var(--color-active); }
        .atk-strike-start { background: var(--color-startup); color: #0b132b; }
        .atk-strike-active { background: var(--color-active); }
        .atk-whiff-rec { background: var(--color-recovery); }
        .atk-shimmy { background: var(--color-shimmy); color: #0b132b; }
        .atk-punish { background: var(--color-punish); }

        .def-guard { background: var(--color-guard); color: #0b132b; }
        .def-tech-window { background: var(--color-tech-window); color: #0b132b; }
        .def-whiff-start { background: var(--color-startup); color: #0b132b; }
        .def-whiff-active { background: var(--color-active); }
        .def-whiff-rec { background: var(--color-recovery); }

        /* 結果ボックス */
        .result-box {
            padding: 16px;
            border-radius: 12px;
            background: var(--bg-secondary);
            border: 2px solid var(--border);
            text-align: center;
            font-size: 15px;
            font-weight: 800;
            margin-bottom: 24px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
            transition: all 0.2s ease;
        }

        /* 凡例 */
        .legend {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            font-size: 11px;
            margin-top: 16px;
            padding-top: 16px;
            border-top: 1px solid var(--border);
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 6px;
            color: var(--text-secondary);
            font-weight: 500;
        }
        .color-box {
            width: 14px;
            height: 14px;
            border-radius: 3px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        /* マトリクス表 */
        .matrix-title {
            margin: 24px 0 12px 0;
            color: var(--accent);
            text-align: center;
            font-size: 16px;
            font-weight: 800;
            letter-spacing: 0.5px;
        }

        .matrix-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 11px;
            background: var(--bg-secondary);
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid var(--border);
        }
        .matrix-table th, .matrix-table td {
            border: 1px solid var(--border);
            padding: 10px 6px;
            text-align: center;
        }
        .matrix-table th {
            background: rgba(0, 0, 0, 0.2);
            color: var(--text-secondary);
            font-weight: 700;
        }
        .matrix-table td:first-child {
            background: rgba(0, 0, 0, 0.15);
            color: var(--text-primary);
            font-weight: 700;
            text-align: left;
            padding-left: 12px;
        }
        
        .res-atk-win { color: #f87171; font-weight: 800; background: rgba(220, 38, 38, 0.15); }
        .res-def-win { color: #34d399; font-weight: 800; background: rgba(52, 211, 153, 0.15); }
        .res-guard { color: var(--color-guard); font-weight: 800; background: rgba(245, 158, 11, 0.08); }
        .res-tech { color: #c084fc; font-weight: 800; background: rgba(192, 132, 252, 0.1); }
        .res-evade { color: var(--text-muted); background: rgba(255,255,255,0.01); }

        .interactive-cell {
            cursor: pointer;
            transition: all 0.15s ease;
        }
        .interactive-cell:hover {
            background: rgba(255, 255, 255, 0.05);
            box-shadow: inset 0 0 0 1px var(--accent);
        }

        /* レスポンシブ調整 */
        @media (max-width: 768px) {
            body {
                padding: 10px;
            }
            .header {
                padding: 10px;
                margin-bottom: 12px;
            }
            .header-left h1 {
                font-size: 14px;
            }
            .btn {
                padding: 5px 8px;
                font-size: 10px;
            }
            .controls-row {
                grid-template-columns: 1fr;
                gap: 12px;
            }
            .controls-panel {
                padding: 12px;
                margin-bottom: 12px;
            }
            .timeline-container {
                padding: 10px;
                margin-bottom: 12px;
            }
            .matrix-table {
                font-size: 10px;
            }
            .matrix-table th, .matrix-table td {
                padding: 8px 4px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <header class="header">
            <div class="header-left">
                <a href="index.html" class="btn">← フレームデータ表</a>
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2.5"
                    stroke-linecap="round" stroke-linejoin="round">
                    <polygon points="5 3 19 3 22 12 19 21 5 21 2 12 5 3"></polygon>
                </svg>
                <h1>投げ抜け・シミー攻防シミュレータ</h1>
            </div>
        </header>

        <section class="controls-panel">
            <div class="controls-row">
                <div class="control-group">
                    <label>攻撃側（起き攻め）</label>
                    <select id="atkAction" class="select-input" autocomplete="off">
                        <option value="throw">投げ</option>
                        <option value="strike">打撃</option>
                        <option value="shimmy">シミー（後ろ歩き）</option>
                    </select>
                </div>
                <div class="control-group" id="throwTimingGroup">
                    <label>投げの着弾（重なり）: <span id="throwVal">5</span>F目 <small>(※5Fが埋めなし最速)</small></label>
                    <input type="range" id="throwSlider" min="1" max="10" value="5">
                </div>
                <div class="control-group" id="strikeTimingGroup">
                    <label>打撃の着弾（重なり）: <span id="strikeVal">2</span>F目 <small>(※1Fが最速)</small></label>
                    <input type="range" id="strikeSlider" min="1" max="10" value="2">
                </div>
                <div class="control-group" id="shimmyTimingGroup" style="display: none;">
                    <label>シミー: <span id="shimmyVal">2</span>F</label>
                    <input type="range" id="shimmySlider" min="0" max="14" value="2">
                </div>
                <div class="control-group">
                    <label>防御側（起き上がり）</label>
                    <select id="defAction" class="select-input" autocomplete="off">
                        <option value="tech-delay">グラップ（タイミング指定）</option>
                        <option value="tech-fast">最速投げ抜け</option>
                        <option value="abare">暴れ（打撃）</option>
                        <option value="backdash">バクステ（1-15F投げ無敵）</option>
                        <option value="guard">ガード継続</option>
                    </select>
                </div>
                <div class="control-group" id="abareTimingGroup" style="display: none;">
                    <label>暴れの発生フレーム: <span id="abareVal">4</span>F</label>
                    <input type="range" id="abareSlider" min="4" max="15" value="4">
                </div>
                <div class="control-group" id="defTimingGroup">
                    <label>投げ遅らせ: <span id="delayVal">5</span>F遅らせ <small>(※0Fが最速)</small></label>
                    <input type="range" id="delaySlider" min="0" max="14" value="5">
                </div>
            </div>
        </section>

        <div class="timeline-container">
            <div class="timeline-grid" id="grid">
                <!-- JSで描画 -->
            </div>
            
            <div class="legend">
                <div class="legend-item"><div class="color-box" style="background: var(--color-startup)"></div>発生前(緑)</div>
                <div class="legend-item"><div class="color-box" style="background: var(--color-active)"></div>攻撃判定(赤)</div>
                <div class="legend-item"><div class="color-box" style="background: var(--color-recovery)"></div>硬直/隙(青)</div>
                <div class="legend-item"><div class="color-box" style="background: var(--color-guard)"></div>ガード(黄)</div>
                <div class="legend-item"><div class="color-box" style="background: var(--color-tech-window)"></div>投げ抜け/無敵(紫)</div>
            </div>
        </div>

        <div class="result-box" id="resultText">
            結果を計算中...
        </div>

        <h2 class="matrix-title">起き攻めマトリクス（基本のじゃんけん）</h2>
        <div class="timeline-container" style="overflow-x: auto;">
            <table class="matrix-table">
                <!-- JSで動的描画 -->
            </table>
        </div>
    </div>

    <script>
        window.applyMatrixSelection = function(atk, def) {
            document.getElementById('atkAction').value = atk;
            
            if (def === 'fast') {
                document.getElementById('defAction').value = 'tech-fast';
            } else if (def === 'delay') {
                document.getElementById('defAction').value = 'tech-delay';
            } else {
                document.getElementById('defAction').value = def;
            }
            
            render();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        };

        const MAX_FRAMES = 40;
        const grid = document.getElementById('grid');
        const atkActionSel = document.getElementById('atkAction');
        const defActionSel = document.getElementById('defAction');
        const delaySlider = document.getElementById('delaySlider');
        const delayVal = document.getElementById('delayVal');
        const throwSlider = document.getElementById('throwSlider');
        const throwVal = document.getElementById('throwVal');
        const strikeSlider = document.getElementById('strikeSlider');
        const strikeVal = document.getElementById('strikeVal');
        const abareSlider = document.getElementById('abareSlider');
        const abareVal = document.getElementById('abareVal');
        const shimmySlider = document.getElementById('shimmySlider');
        const shimmyVal = document.getElementById('shimmyVal');
        const resultText = document.getElementById('resultText');

        function render() {
            grid.innerHTML = '';
            
            const atkAction = atkActionSel.value;
            const defAction = defActionSel.value;
            let throwInputFrame = parseInt(delaySlider.value) + 1; // 0ベース表示を内部1ベースに変換
            let strikeHitFrame = parseInt(strikeSlider.value);
            let throwHitFrame = parseInt(throwSlider.value);
            let abareHitFrame = parseInt(abareSlider.value);
            let shimmyEvadeFrame = parseInt(shimmySlider.value) + 1;
            
            // UI制御
            document.getElementById('throwTimingGroup').style.display = (atkAction === 'throw') ? 'flex' : 'none';
            document.getElementById('strikeTimingGroup').style.display = (atkAction === 'strike') ? 'flex' : 'none';
            document.getElementById('shimmyTimingGroup').style.display = (atkAction === 'shimmy') ? 'flex' : 'none';
            document.getElementById('defTimingGroup').style.display = (defAction === 'tech-delay') ? 'flex' : 'none';
            document.getElementById('abareTimingGroup').style.display = (defAction === 'abare') ? 'flex' : 'none';
            
            if (defAction === 'tech-fast') throwInputFrame = 1;
            if (defAction === 'guard') throwInputFrame = 999;
            
            // ヘッダー行
            grid.innerHTML += `<div class="row-header">フレーム</div>`;
            for (let i = 1; i <= MAX_FRAMES; i++) {
                grid.innerHTML += `<div class="frame-header">${i}</div>`;
            }

            let atkCells = [];
            let defCells = [];
            let resultMessage = "";
            let resultColor = "";

            let isTechAction = (defAction === 'tech-delay' || defAction === 'tech-fast');
            let defThrowActiveFrame = isTechAction ? throwInputFrame + 4 : 999;
            let isTechSuccess = (atkAction === 'throw' && isTechAction && throwInputFrame <= throwHitFrame + 8 && defThrowActiveFrame >= throwHitFrame);
            let isDefThrowWin = (atkAction === 'strike' && isTechAction && defThrowActiveFrame < strikeHitFrame);
            let isHitByStrike = (atkAction === 'strike' && isTechAction && !isDefThrowWin && throwInputFrame <= strikeHitFrame);
            
            let isAbareWinVsThrow = (atkAction === 'throw' && defAction === 'abare' && abareHitFrame < throwHitFrame);
            let isAbareWinVsStrike = (atkAction === 'strike' && defAction === 'abare' && abareHitFrame < strikeHitFrame);
            let isAbareTradeVsStrike = (atkAction === 'strike' && defAction === 'abare' && abareHitFrame === strikeHitFrame);
            let isAbareLoseVsThrow = (atkAction === 'throw' && defAction === 'abare' && abareHitFrame >= throwHitFrame);
            let isAbareLoseVsStrike = (atkAction === 'strike' && defAction === 'abare' && abareHitFrame > strikeHitFrame);

            let isShimmyGuardsAbare = (atkAction === 'shimmy' && defAction === 'abare');
            let isShimmySuccess = (atkAction === 'shimmy' && isTechAction && throwInputFrame >= shimmyEvadeFrame);
            let isShimmyHitByThrow = (atkAction === 'shimmy' && isTechAction && throwInputFrame < shimmyEvadeFrame);

            for (let i = 1; i <= MAX_FRAMES; i++) {
                let aClass = ''; let aText = '';
                let dClass = ''; let dText = '';

                // --- 攻撃側 ---
                if (atkAction === 'throw') {
                    if (i >= Math.max(1, throwHitFrame - 4) && i < throwHitFrame) { aClass = 'atk-throw-start'; aText = '発'; }
                    else if (i >= throwHitFrame && i <= throwHitFrame + 2) { aClass = 'atk-throw-active'; aText = '投'; }
                    else if (i > throwHitFrame + 2 && i <= throwHitFrame + 24 && !isTechSuccess) { aClass = 'atk-whiff-rec'; aText = '隙'; }
                } else if (atkAction === 'strike') {
                    if (isDefThrowWin && i >= defThrowActiveFrame) {
                        aClass = 'atk-punish'; aText = '被';
                    } else {
                        if (i >= Math.max(1, strikeHitFrame - 3) && i < strikeHitFrame) { aClass = 'atk-strike-start'; aText = '発'; }
                        else if (i >= strikeHitFrame && i <= strikeHitFrame + 2) { aClass = 'atk-strike-active'; aText = '打'; }
                        else if (i > strikeHitFrame + 2 && i <= strikeHitFrame + 15) { aClass = 'atk-whiff-rec'; aText = '隙'; }
                    }
                } else if (atkAction === 'shimmy') {
                    if (isShimmyHitByThrow && i >= defThrowActiveFrame && i <= defThrowActiveFrame + 15) {
                        aClass = 'atk-punish'; aText = '被'; // 投げを食らう
                    } else if (isShimmyGuardsAbare && i >= abareHitFrame && i <= abareHitFrame + 15) {
                        aClass = 'def-guard'; aText = 'ガ'; // 暴れをガード
                    } else {
                        if (isShimmySuccess && i >= throwInputFrame + 15 && i < throwInputFrame + 25) {
                            aClass = 'atk-punish'; aText = 'パ'; // パニカン攻撃
                        } else if (!isShimmyHitByThrow && !isShimmyGuardsAbare) {
                            if (i < shimmyEvadeFrame + 4) {
                                aClass = 'atk-shimmy'; aText = '歩'; // 下がり中
                            } else if (i <= 15) {
                                aClass = 'def-whiff-rec'; aText = '外'; // 間合い外
                            }
                        }
                    }
                }
                
                // 攻撃側の上書き（暴れ勝ち・相打ちの場合）
                if (defAction === 'abare') {
                    if (isAbareWinVsThrow && i >= abareHitFrame && i <= abareHitFrame + 15) {
                        aClass = 'atk-punish'; aText = '被';
                    } else if (isAbareWinVsStrike && i >= abareHitFrame && i <= abareHitFrame + 15) {
                        aClass = 'atk-punish'; aText = '被';
                    } else if (isAbareTradeVsStrike && i >= strikeHitFrame && i <= strikeHitFrame + 15) {
                        aClass = 'atk-punish'; aText = '被';
                    }
                }

                // --- 防御側 ---
                if (defAction === 'guard') {
                    if (atkAction === 'strike' && i >= strikeHitFrame && i <= strikeHitFrame + 15) {
                        dClass = 'def-guard'; dText = 'ガ';
                    } else if (atkAction === 'throw' && i >= throwHitFrame && i <= throwHitFrame + 15) {
                        dClass = 'atk-punish'; dText = '被';
                    } else {
                        dClass = 'def-guard'; dText = 'G';
                    }
                } else if (defAction === 'tech-delay' || defAction === 'tech-fast') {
                    if (atkAction === 'shimmy' && isShimmyHitByThrow) {
                        if (i < throwInputFrame) {
                            dClass = 'def-guard'; dText = 'G';
                        } else if (i === throwInputFrame) {
                            dClass = 'def-tech-window'; dText = '入';
                        } else if (i >= defThrowActiveFrame && i <= defThrowActiveFrame + 15) {
                            dClass = 'atk-throw-active'; dText = '投'; // 投げ成功！
                        } else if (i > throwInputFrame && i < defThrowActiveFrame) {
                            dClass = 'def-whiff-start'; dText = '発';
                        }
                    } else if (isHitByStrike && i >= strikeHitFrame && i <= strikeHitFrame + 15) {
                        dClass = 'atk-punish'; dText = '被';
                    } else if (i < throwInputFrame) {
                        dClass = 'def-guard'; dText = 'G';
                    } else if (i === throwInputFrame) {
                        dClass = 'def-tech-window'; dText = '入';
                        if (isTechSuccess) { dText = '抜'; aClass = 'def-tech-window'; aText = '抜'; }
                    } else if (i > throwInputFrame && i < throwInputFrame + 30 && !isHitByStrike && !isDefThrowWin) {
                        if (!isTechSuccess) {
                            if (i < throwInputFrame + 4) { dClass = 'def-whiff-start'; dText='発'; }
                            else if (i < throwInputFrame + 7) { dClass = 'def-whiff-active'; dText='投'; }
                            else { dClass = 'def-whiff-rec'; dText='隙'; }
                        }
                    }
                } else if (defAction === 'abare') {
                    if (isAbareLoseVsThrow && i >= throwHitFrame && i <= throwHitFrame + 15) {
                        dClass = 'atk-punish'; dText = '被';
                    } else if (isAbareLoseVsStrike && i >= strikeHitFrame && i <= strikeHitFrame + 15) {
                        dClass = 'atk-punish'; dText = '被';
                    } else if (isAbareTradeVsStrike && i >= strikeHitFrame && i <= strikeHitFrame + 15) {
                        dClass = 'atk-punish'; dText = '被';
                    } else {
                        let endF = (atkAction === 'throw') ? throwHitFrame : (atkAction === 'strike' ? strikeHitFrame : 999);
                        if (i < endF || isAbareWinVsThrow || isAbareWinVsStrike || isShimmyGuardsAbare) {
                            if (i >= 1 && i < abareHitFrame) { dClass = 'atk-strike-start'; dText='発'; }
                            else if (i >= abareHitFrame && i <= abareHitFrame + 2) { dClass = 'atk-strike-active'; dText='打'; }
                            else if (i > abareHitFrame + 2 && i <= abareHitFrame + 15) { dClass = 'atk-whiff-rec'; dText='隙'; }
                        }
                    }
                } else if (defAction === 'backdash') {
                    if (atkAction === 'throw' && throwHitFrame > 15 && throwHitFrame <= 23 && i >= throwHitFrame && i <= throwHitFrame + 15) {
                        dClass = 'atk-punish'; dText = '被';
                    } else if (atkAction === 'strike' && strikeHitFrame <= 23 && i >= strikeHitFrame && i <= strikeHitFrame + 15) {
                        dClass = 'atk-punish'; dText = '被';
                    } else {
                        let endF = (atkAction === 'throw' && throwHitFrame > 15 && throwHitFrame <= 23) ? throwHitFrame : 
                                   (atkAction === 'strike' && strikeHitFrame <= 23) ? strikeHitFrame : 999;
                        if (i < endF && i <= 23) {
                            if (i <= 15) { dClass = 'def-tech-window'; dText='避'; } // 投げ無敵
                            else { dClass = 'def-whiff-rec'; dText='隙'; } // 硬直
                        }
                    }
                }

                // テキストクリア (投げ抜け成立後)
                if (isTechSuccess && i > throwInputFrame) {
                    aClass = ''; aText = ''; dClass = ''; dText = '';
                }

                atkCells.push(`<div class="cell ${aClass}">${aText}</div>`);
                defCells.push(`<div class="cell ${dClass}">${dText}</div>`);
            }

            // 結果判定まとめ
            if (defAction === 'abare') {
                if (atkAction === 'throw') {
                    if (abareHitFrame < throwHitFrame) {
                        resultMessage = "🎉 暴れ勝ち！ (投げ発生前に打撃がヒット)";
                        resultColor = "var(--color-startup)";
                    } else {
                        resultMessage = "💥 投げを食らった！ (暴れ潰し)";
                        resultColor = "var(--color-punish)";
                    }
                } else if (atkAction === 'strike') {
                    if (abareHitFrame < strikeHitFrame) {
                        resultMessage = "🎉 暴れ勝ち！ (相手の打撃発生前にヒット)";
                        resultColor = "var(--color-startup)";
                    } else if (abareHitFrame === strikeHitFrame) {
                        resultMessage = "💥 相打ち！ (お互いにダメージ)";
                        resultColor = "var(--color-punish)";
                    } else {
                        resultMessage = "💥 カウンター！ (暴れ潰し)";
                        resultColor = "var(--color-punish)";
                    }
                } else if (atkAction === 'shimmy') {
                    resultMessage = "🛡️ シミー側は後ろ歩き中のため暴れをガード！";
                    resultColor = "var(--color-guard)";
                }
            } else if (atkAction === 'shimmy') {
                if (isShimmyGuardsAbare) {
                    resultMessage = "🛡️ 相手の暴れを安全にガード！ (シミー側はガード状態)";
                    resultColor = "var(--color-guard)";
                } else if (isShimmyHitByThrow) {
                    resultMessage = "💥 シミーが間に合わず、投げを食らった！";
                    resultColor = "var(--color-punish)";
                } else if (isShimmySuccess) {
                    resultMessage = "☠️ シミー成功！ 投げを空振ってしまいパニカン確定！";
                    resultColor = "var(--color-whiff)";
                } else if (defAction === 'guard' || defAction === 'backdash') {
                    resultMessage = "👀 お互いに距離が離れた";
                    resultColor = "var(--color-shimmy)";
                }
            } else if (defAction === 'backdash') {
                if (atkAction === 'throw') {
                    // 投げ全体F = 着弾F + 残り25F（発生5F+持続3F+硬直22F=30F、5F着弾時 5+25=30F）
                    // バクステ全体F = 23F固定
                    let throwTotalF = throwHitFrame + 25;
                    let backdashTotalF = 23;
                    let frameAdv = backdashTotalF - throwTotalF;
                    let advStr = frameAdv >= 0 ? `+${frameAdv}F` : `${frameAdv}F`;
                    if (throwHitFrame <= 15) {
                        resultMessage = `💨 バクステの投げ無敵で回避！ ${advStr}`;
                        resultColor = "var(--color-tech-window)";
                        // バクステ回避後の攻撃側の硬直をパニカン色に
                        for(let i = 16; i < throwHitFrame + 25; i++) {
                            if(i < MAX_FRAMES) atkCells[i] = `<div class="cell atk-punish">パ</div>`;
                        }
                    } else if (throwHitFrame <= 23) {
                        resultMessage = `💥 バクステ硬直に投げが刺さった！ ${advStr}`;
                        resultColor = "var(--color-punish)";
                    } else {
                        resultMessage = `👀 お見合い ${advStr}`;
                        resultColor = "var(--color-shimmy)";
                    }
                } else if (atkAction === 'strike') {
                    if (strikeHitFrame <= 23) {
                        resultMessage = "💥 バクステを狩られた！ (ヒット)";
                        resultColor = "var(--color-punish)";
                    } else {
                        resultMessage = "👀 何も起きずにお見合い状態";
                        resultColor = "var(--color-shimmy)";
                    }
                } else if (atkAction === 'shimmy') {
                    resultMessage = "👀 お互いに距離が離れた";
                    resultColor = "var(--color-shimmy)";
                }
            } else {
                let isTechAction = (defAction === 'tech-delay' || defAction === 'tech-fast');
                let defThrowActiveFrame = isTechAction ? throwInputFrame + 4 : 999;
                let isTechSuccess = (atkAction === 'throw' && isTechAction && throwInputFrame <= throwHitFrame + 8 && defThrowActiveFrame >= throwHitFrame);
                let isDefThrowWin = (atkAction === 'strike' && isTechAction && defThrowActiveFrame < strikeHitFrame);
                let isHitByStrike = (atkAction === 'strike' && isTechAction && !isDefThrowWin && throwInputFrame <= strikeHitFrame);

                if (isTechSuccess) {
                    resultMessage = "✨ 投げ抜け成功！ (安全に距離が離れる)";
                    resultColor = "var(--color-tech-window)";
                } else if (atkAction === 'throw' && defAction === 'guard') {
                    resultMessage = "💥 投げを食らった！";
                    resultColor = "var(--color-punish)";
                } else if (isHitByStrike) {
                    if (throwInputFrame === strikeHitFrame) {
                        resultMessage = "💥 ガードを解いて投げを入力した瞬間に打撃を食らった！ (カウンター)";
                    } else {
                        resultMessage = "💥 投げの発生前に打撃を食らった！ (カウンター)";
                    }
                    resultColor = "var(--color-punish)";
                } else if (isDefThrowWin) {
                    resultMessage = "🎉 打撃の発生前に投げが決まった！ (防御側の勝ち)";
                    resultColor = "var(--color-tech-window)";
                } else if (atkAction === 'strike' && defAction === 'guard') {
                    resultMessage = "🛡️ 打撃を安全にガード！";
                    resultColor = "var(--color-guard)";
                } else if (atkAction === 'strike' && isTechAction) {
                    let techStr = throwInputFrame === 1 ? "最速抜け" : "遅らせグラップ";
                    resultMessage = `🛡️ 打撃を安全にガード！ (${techStr}のガード部分が機能)`;
                    resultColor = "var(--color-guard)";
                } else if (atkAction === 'shimmy' && isTechAction) {
                    // Shimmy results are now fully handled in the dedicated atkAction === 'shimmy' block above.
                } else if (atkAction === 'shimmy' && defAction === 'guard') {
                    resultMessage = "👀 何も起きずにお見合い状態";
                    resultColor = "var(--color-shimmy)";
                }
            }

            // 描画
            grid.innerHTML += `<div class="row-header">攻撃側</div>` + atkCells.join('');
            grid.innerHTML += `<div class="row-header">防御側</div>` + defCells.join('');
            
            resultText.innerText = resultMessage;
            resultText.style.borderColor = resultColor;
            resultText.style.color = resultColor;

            // マトリクスの動的更新
            const evaluate = (atk, def) => {
                let sHit = strikeHitFrame; 
                let tHit = throwHitFrame;
                let dIn = parseInt(delaySlider.value) + 1; // 0ベース表示を内部1ベースに変換
                
                if (atk === 'throw') {
                    if (def === 'fast') {
                        if (1 <= tHit + 8 && 5 >= tHit) return { class: 'res-tech', text: '✨ 抜け成立' };
                        return { class: 'res-atk-win', text: '💥 投げ被弾' };
                    }
                    if (def === 'delay') {
                        if (dIn <= tHit + 8 && dIn + 4 >= tHit) return { class: 'res-tech', text: '✨ 抜け成立' };
                        if (dIn < tHit) return { class: 'res-atk-win', text: '☠️ 投げ被弾' };
                        return { class: 'res-atk-win', text: '💥 投げ被弾' };
                    }
                    if (def === 'abare') {
                        let aHit = parseInt(abareSlider.value);
                        if (aHit < tHit) return { class: 'res-def-win', text: '🎉 暴れ勝ち' };
                        return { class: 'res-atk-win', text: '💥 投げ勝ち' };
                    }
                    if (def === 'guard') return { class: 'res-atk-win', text: '💥 投げ被弾' };
                    if (def === 'backdash') return { class: 'res-def-win', text: '💨 回避(確反)' };
                }
                if (atk === 'strike') {
                    if (def === 'fast') {
                        if (sHit > 5) return { class: 'res-def-win', text: '🎉 投げ勝ち' };
                        return { class: 'res-atk-win', text: '💥 カウンター' };
                    }
                    if (def === 'delay') {
                        let dAct = dIn + 4; // 防御側の投げ持続発生
                        if (dAct < sHit) return { class: 'res-def-win', text: '🎉 投げ勝ち' };
                        if (dIn <= sHit) {
                            return { class: 'res-atk-win', text: '💥 カウンター' };
                        }
                        return { class: 'res-guard', text: '🛡️ ガード' };
                    }
                    if (def === 'abare') {
                        let aHit = parseInt(abareSlider.value);
                        if (aHit < sHit) return { class: 'res-def-win', text: '🎉 暴れ勝ち' };
                        if (aHit === sHit) return { class: 'res-atk-win', text: '💥 相打ち' };
                        return { class: 'res-atk-win', text: '💥 カウンター' };
                    }
                    if (def === 'guard') return { class: 'res-guard', text: '🛡️ ガード' };
                    if (def === 'backdash') return { class: 'res-atk-win', text: '💥 ヒット' };
                }
                if (atk === 'shimmy') {
                    let sEvade = parseInt(shimmySlider.value) + 1;
                    if (def === 'fast') {
                        if (1 >= sEvade) return { class: 'res-atk-win', text: '☠️ パニカン(スカ)' };
                        return { class: 'res-def-win', text: '🎉 投げ被弾' };
                    }
                    if (def === 'delay') {
                        if (dIn >= sEvade) return { class: 'res-atk-win', text: '☠️ パニカン(スカ)' };
                        return { class: 'res-def-win', text: '🎉 投げ被弾' };
                    }
                    if (def === 'abare') return { class: 'res-guard', text: '🛡️ ガード' };
                    if (def === 'guard') return { class: 'res-evade', text: '👀 様子見' };
                    if (def === 'backdash') return { class: 'res-evade', text: '👀 様子見' };
                }
            };

            const getCellHtml = (atk, def) => {
                let res = evaluate(atk, def);
                return `<td onclick="applyMatrixSelection('${atk}', '${def}')" class="${res.class} interactive-cell">${res.text}</td>`;
            };

            const matHtml = `
                <thead>
                    <tr>
                        <th>攻撃側 \\ 防御側</th>
                        <th>最速投げ抜け</th>
                        <th style="color:var(--color-tech-window)">設定グラップ (${parseInt(delaySlider.value)}F遅らせ)</th>
                        <th>設定暴れ (${abareSlider.value}F)</th>
                        <th>ガード継続</th>
                        <th>バクステ (1-15F無敵)</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td style="color:var(--color-punish)">設定投げ (着弾${throwHitFrame}F)</td>
                        ${getCellHtml('throw','fast')}
                        ${getCellHtml('throw','delay')}
                        ${getCellHtml('throw','abare')}
                        ${getCellHtml('throw','guard')}
                        ${getCellHtml('throw','backdash')}
                    </tr>
                    <tr>
                        <td style="color:var(--color-punish)">設定打撃 (着弾${strikeHitFrame}F)</td>
                        ${getCellHtml('strike','fast')}
                        ${getCellHtml('strike','delay')}
                        ${getCellHtml('strike','abare')}
                        ${getCellHtml('strike','guard')}
                        ${getCellHtml('strike','backdash')}
                    </tr>
                    <tr>
                        <td>設定シミー (${parseInt(shimmySlider.value)}F)</td>
                        ${getCellHtml('shimmy','fast')}
                        ${getCellHtml('shimmy','delay')}
                        ${getCellHtml('shimmy','abare')}
                        ${getCellHtml('shimmy','guard')}
                        ${getCellHtml('shimmy','backdash')}
                    </tr>
                </tbody>
            `;
            document.querySelector('.matrix-table').innerHTML = matHtml;
        }

        // 状態変更時にsessionStorageへ保存（リロード時の復元に使用）
        function saveState() {
            sessionStorage.setItem('atkAction', atkActionSel.value);
            sessionStorage.setItem('defAction', defActionSel.value);
        }

        atkActionSel.addEventListener('change', () => { saveState(); render(); });
        defActionSel.addEventListener('change', () => { saveState(); render(); });
        delaySlider.addEventListener('input', (e) => {
            delayVal.innerText = e.target.value;
            render();
        });
        strikeSlider.addEventListener('input', (e) => {
            strikeVal.innerText = e.target.value;
            render();
        });
        throwSlider.addEventListener('input', (e) => {
            throwVal.innerText = e.target.value;
            render();
        });
        abareSlider.addEventListener('input', (e) => {
            abareVal.innerText = e.target.value;
            render();
        });
        shimmySlider.addEventListener('input', (e) => {
            shimmyVal.innerText = e.target.value;
            render();
        });

        // 初期描画
        // sessionStorageから値を復元してからrender()を呼ぶことで、
        // ブラウザのセッション履歴によるフォーム復元タイミングに依存しない
        const savedAtk = sessionStorage.getItem('atkAction');
        const savedDef = sessionStorage.getItem('defAction');
        if (savedAtk) atkActionSel.value = savedAtk;
        if (savedDef) defActionSel.value = savedDef;
        render();
    </script>
</body>
</html>
