<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>択ビジュ | SF6 投げ抜け・シミー攻防ビジュアライザー</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0a0e1a;
            --bg-card: rgba(17, 24, 39, 0.78);
            --border: rgba(99, 102, 241, 0.18);
            --text-primary: #f1f5f9;
            --text-secondary: #cbd5e1;
            --text-muted: #64748b;
            --accent: #6366f1;

            --color-startup: #22c55e;     /* 緑: 発生前 */
            --color-active: #ef4444;      /* 赤: 攻撃判定(投げ・打撃) */
            --color-recovery: #3b82f6;    /* 青: 硬直(空振り隙) */
            --color-guard-wait: #1e293b;  /* 暗紺: ガード入力待機中(後ろ入れ) */
            --color-guard: #eab308;       /* 黄色: ガード硬直(ブロックスタン) */
            --color-tech-window: #c084fc; /* 紫: 投げ抜け・無敵回避 */
            --color-shimmy: #94a3b8;      /* 灰: 後ろ下がり */
            --color-punish: #dc2626;      /* 濃赤: 被弾・カウンター */
            --color-whiff: #ec4899;       /* ピンク: パニカン確定 */
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            padding: 16px 20px 40px;
            margin: 0;
            line-height: 1.5;
        }

        .top-nav {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }
        .top-nav h1 {
            margin: 0;
            font-size: 18px;
            color: #818cf8;
        }
        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 14px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: rgba(99, 102, 241, 0.12);
            color: var(--text-primary);
            font-size: 12px;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.2s;
        }
        .back-btn:hover {
            background: rgba(99, 102, 241, 0.25);
            border-color: var(--accent);
        }

        .controls {
            background: var(--bg-card);
            border: 1px solid var(--border);
            padding: 16px;
            border-radius: 12px;
            margin-bottom: 16px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
            gap: 16px;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        label {
            font-size: 12px;
            color: var(--text-secondary);
            font-weight: 600;
        }
        label small {
            color: var(--text-muted);
            font-weight: 400;
        }

        select, input[type="range"] {
            background: rgba(15, 23, 42, 0.9);
            border: 1px solid var(--border);
            color: white;
            padding: 8px 10px;
            border-radius: 6px;
            font-family: inherit;
            font-size: 13px;
        }

        input[type="range"] {
            padding: 4px 0;
            accent-color: var(--accent);
            cursor: pointer;
        }

        .timeline-container {
            overflow-x: auto;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 16px;
            -webkit-overflow-scrolling: touch;
        }

        .timeline-header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            flex-wrap: wrap;
            gap: 8px;
        }
        .timeline-title {
            font-size: 13px;
            font-weight: 700;
            color: #a5b4fc;
        }
        .timeline-hint {
            font-size: 11px;
            color: var(--text-muted);
        }

        .timeline-grid {
            display: grid;
            grid-template-columns: 145px repeat(40, 24px) 150px;
            gap: 2px;
            align-items: center;
            min-width: max-content;
        }

        .row-header {
            font-size: 11px;
            font-weight: 600;
            text-align: right;
            padding: 4px 10px 4px 6px;
            color: var(--text-secondary);
            white-space: nowrap;
            border-radius: 6px 0 0 6px;
            height: 26px;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 6px;
            position: sticky;
            left: 0;
            background: #0f1629;
            z-index: 5;
            border-right: 1px solid var(--border);
        }

        .row-header.atk-row-label {
            color: #fca5a5;
            font-weight: 800;
            background: #17152b;
        }

        .row-header.def-row-label {
            cursor: pointer;
            transition: background 0.15s, color 0.15s;
        }
        .row-header.def-row-label:hover {
            background: #1e293b;
            color: #fff;
        }
        .row-header.def-row-label.active-track {
            background: rgba(99, 102, 241, 0.25);
            color: #fff;
            font-weight: 800;
            box-shadow: inset 3px 0 0 var(--accent);
        }

        .row-outcome {
            font-size: 11px;
            font-weight: 700;
            padding: 0 10px;
            height: 26px;
            display: flex;
            align-items: center;
            white-space: nowrap;
            border-radius: 0 6px 6px 0;
            margin-left: 4px;
            cursor: pointer;
        }

        .grid-separator {
            grid-column: 1 / -1;
            height: 1px;
            background: rgba(99, 102, 241, 0.25);
            margin: 4px 0;
        }

        .frame-header {
            font-size: 10px;
            color: var(--text-muted);
            text-align: center;
            padding-bottom: 2px;
        }
        .frame-header.tech-win-col {
            color: var(--color-tech-window);
            font-weight: 800;
            background: rgba(192, 132, 252, 0.12);
            border-radius: 3px;
        }

        .cell {
            height: 26px;
            border-radius: 3px;
            background: rgba(255, 255, 255, 0.04);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            font-weight: 700;
            color: white;
            position: relative;
            user-select: none;
        }
        .cell.clickable-cell {
            cursor: pointer;
        }
        .cell.focused-row-cell {
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.18), inset 0 -1px 0 rgba(255, 255, 255, 0.18);
        }

        /* 状態ごとの色付け */
        .atk-throw-start { background: var(--color-startup); color: #052e16; }
        .atk-throw-active { background: var(--color-active); color: #fff; }
        .atk-strike-start { background: var(--color-startup); color: #052e16; }
        .atk-strike-active { background: var(--color-active); color: #fff; }
        .atk-whiff-rec { background: var(--color-recovery); color: #fff; }
        .atk-shimmy { background: var(--color-shimmy); color: #0f172a; }
        .atk-punish { background: var(--color-punish); color: #fff; }
        .atk-pc { background: var(--color-whiff); color: #fff; }

        .def-guard-wait { background: var(--color-guard-wait); color: #94a3b8; border: 1px solid rgba(148, 163, 184, 0.2); }
        .def-guard { background: var(--color-guard); color: #1e1b4b; }
        .def-guard-os { background: var(--color-guard); color: #1e1b4b; box-shadow: inset 0 0 0 2px #c084fc; }
        .def-tech-window { background: var(--color-tech-window); color: #1e1b4b; }
        .def-whiff-start { background: var(--color-startup); color: #052e16; }
        .def-whiff-active { background: var(--color-active); color: #fff; }
        .def-whiff-rec { background: var(--color-recovery); color: #fff; }

        .result-box {
            padding: 14px 18px;
            border-radius: 10px;
            background: rgba(15, 23, 42, 0.92);
            border: 2px solid var(--border);
            text-align: center;
            font-size: 15px;
            font-weight: 800;
            margin-bottom: 24px;
        }

        .legend {
            display: flex;
            flex-wrap: wrap;
            gap: 14px;
            font-size: 11px;
            margin-top: 12px;
            padding-top: 10px;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
            color: var(--text-secondary);
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .color-box {
            width: 12px;
            height: 12px;
            border-radius: 3px;
        }

        /* マトリクス表 */
        .matrix-section-title {
            margin: 24px 0 12px;
            color: #818cf8;
            text-align: center;
            font-size: 16px;
            font-weight: 800;
        }
        .matrix-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
            background: rgba(15, 23, 42, 0.4);
            border-radius: 8px;
            overflow: hidden;
        }
        .matrix-table th, .matrix-table td {
            border: 1px solid var(--border);
            padding: 10px 8px;
            text-align: center;
        }
        .matrix-table th {
            background: rgba(15, 23, 42, 0.9);
            color: #a5b4fc;
            font-weight: 700;
        }
        .matrix-table td:first-child {
            background: rgba(15, 23, 42, 0.9);
            color: #a5b4fc;
            font-weight: 700;
            text-align: left;
        }

        .res-atk-win { color: #f87171; font-weight: 700; background: rgba(220, 38, 38, 0.12); }
        .res-def-win { color: #4ade80; font-weight: 700; background: rgba(34, 197, 94, 0.12); }
        .res-guard { color: var(--color-guard); font-weight: 700; background: rgba(234, 179, 8, 0.08); }
        .res-tech { color: var(--color-tech-window); font-weight: 700; background: rgba(192, 132, 252, 0.12); }
        .res-evade { color: var(--text-secondary); }

        .interactive-cell {
            cursor: pointer;
            transition: all 0.15s ease;
        }
        .interactive-cell:hover {
            filter: brightness(1.25);
            box-shadow: inset 0 0 0 1px rgba(255,255,255,0.4);
        }
        .interactive-cell.selected-matrix-cell {
            box-shadow: inset 0 0 0 2px #fff;
            filter: brightness(1.2);
        }
    </style>
</head>
<body>

    <div class="top-nav">
        <h1>択ビジュ <small style="font-size: 13px; color: var(--text-muted); font-weight: 400;">— SF6 投げ抜け・シミー攻防ビジュアライザー</small></h1>
        <a href="index.html" class="back-btn">← フレーム表へ戻る</a>
    </div>

    <div class="controls">
        <div class="control-group">
            <label>① 攻撃側の行動（起き攻め）</label>
            <select id="atkAction" autocomplete="off">
                <option value="throw">投げ重ね（通常投げ 発生5F/全体30F）</option>
                <option value="strike">打撃重ね（小〜中技 持続3F想定）</option>
                <option value="shimmy">シミー（後ろ下がり様子見）</option>
            </select>
        </div>
        <div class="control-group" id="throwTimingGroup">
            <label>投げの着弾（重なり）: <span id="throwVal">5</span>F目 <small>(1F=最速埋め / 5F=起き上がり同時押し)</small></label>
            <input type="range" id="throwSlider" min="1" max="12" value="5">
        </div>
        <div class="control-group" id="strikeTimingGroup" style="display: none;">
            <label>打撃の着弾（重なり）: <span id="strikeVal">2</span>F目 <small>(1〜2F=最速重ね / 7F〜=遅らせ打撃)</small></label>
            <input type="range" id="strikeSlider" min="1" max="12" value="2">
        </div>
        <div class="control-group" id="shimmyTimingGroup" style="display: none;">
            <label>シミーで投げ間合い外に出るF: <span id="shimmyVal">2</span>F目</label>
            <input type="range" id="shimmySlider" min="1" max="12" value="2">
        </div>
        <div class="control-group">
            <label>② 遅らせグラップの入力タイミング: <span id="delayVal">5</span>F遅らせ <small>(<span id="delayInputF">6</span>F目入力)</small></label>
            <input type="range" id="delaySlider" min="1" max="14" value="5">
        </div>
        <div class="control-group">
            <label>③ 暴れ（打撃）の発生フレーム: <span id="abareVal">4</span>F</label>
            <input type="range" id="abareSlider" min="4" max="12" value="4">
        </div>
        <div class="control-group">
            <label>詳細フォーカス中の防御行動 <small>(行クリックでも切替可)</small></label>
            <select id="defAction" autocomplete="off">
                <option value="tech-delay">② 遅らせグラップ</option>
                <option value="tech-fast">① 最速投げ抜け (1F目入力)</option>
                <option value="abare">③ 暴れ (打撃)</option>
                <option value="guard">④ ガード継続</option>
                <option value="backdash">⑤ バクステ (1-15F投げ無敵/全体23F)</option>
            </select>
        </div>
    </div>

    <div class="timeline-container">
        <div class="timeline-header-bar">
            <span class="timeline-title">マルチフレームメーター（攻撃側 1本 vs 防御側 全5択）</span>
            <span class="timeline-hint">※防御側の各行（または下のマトリクス表）をタップすると、攻撃側バーの反応と詳細結果が切り替わります</span>
        </div>
        <div class="timeline-grid" id="grid">
            <!-- JSで6本を描画 -->
        </div>
        
        <div class="legend">
            <div class="legend-item"><div class="color-box" style="background: var(--color-startup)"></div>発生前(緑)</div>
            <div class="legend-item"><div class="color-box" style="background: var(--color-active)"></div>攻撃判定(赤)</div>
            <div class="legend-item"><div class="color-box" style="background: var(--color-recovery)"></div>硬直・隙(青)</div>
            <div class="legend-item"><div class="color-box" style="background: var(--color-guard-wait); border: 1px solid #64748b;"></div>ガード待機(G)</div>
            <div class="legend-item"><div class="color-box" style="background: var(--color-guard)"></div>ガード硬直(ガ)</div>
            <div class="legend-item"><div class="color-box" style="background: var(--color-tech-window)"></div>投げ抜け猶予・無敵(紫)</div>
            <div class="legend-item"><div class="color-box" style="background: var(--color-punish)"></div>被弾・カウンター(赤)</div>
            <div class="legend-item"><div class="color-box" style="background: var(--color-whiff)"></div>パニカン確定(桃)</div>
        </div>
    </div>

    <div class="result-box" id="resultText">
        結果を計算中...
    </div>

    <h2 class="matrix-section-title">起き攻めマトリクス（全組み合わせ一覧 — セルをクリックでフォーカス）</h2>
    <div class="timeline-container">
        <table class="matrix-table" id="matrixTable"></table>
    </div>

    <script>
        const MAX_FRAMES = 40;
        const TECH_WINDOW = 8; // 投げ着弾フレームから +8F まで投げ抜け成立
        const BACKDASH_INVULN = 15; // 1〜15F 投げ無敵
        const BACKDASH_TOTAL = 23;  // バクステ全体23F

        const grid = document.getElementById('grid');
        const atkActionSel = document.getElementById('atkAction');
        const defActionSel = document.getElementById('defAction');
        const delaySlider = document.getElementById('delaySlider');
        const delayVal = document.getElementById('delayVal');
        const delayInputF = document.getElementById('delayInputF');
        const throwSlider = document.getElementById('throwSlider');
        const throwVal = document.getElementById('throwVal');
        const strikeSlider = document.getElementById('strikeSlider');
        const strikeVal = document.getElementById('strikeVal');
        const abareSlider = document.getElementById('abareSlider');
        const abareVal = document.getElementById('abareVal');
        const shimmySlider = document.getElementById('shimmySlider');
        const shimmyVal = document.getElementById('shimmyVal');
        const resultText = document.getElementById('resultText');

        window.selectTrack = function(defKey) {
            defActionSel.value = defKey;
            saveState();
            render();
        };

        window.applyMatrixSelection = function(atk, defKey) {
            atkActionSel.value = atk;
            defActionSel.value = defKey;
            saveState();
            render();
        };

        /**
         * 1つの組み合わせ (atkAction, defKey) について、
         * 勝敗判定・40フレーム分の攻撃側セル配列・防御側セル配列を計算して返す
         */
        function simulatePair(atkAction, defKey, params) {
            const { throwHitFrame, strikeHitFrame, shimmyEvadeFrame, delayInputFrame, abareHitFrame } = params;

            const isTech = (defKey === 'tech-fast' || defKey === 'tech-delay');
            const throwInputFrame = (defKey === 'tech-fast') ? 1 : (defKey === 'tech-delay' ? delayInputFrame : 999);
            const defThrowActiveFrame = isTech ? throwInputFrame + 4 : 999; // 発生5F (入力F + 4)
            const defThrowEndActive = defThrowActiveFrame + 2; // 持続3F
            const defThrowEndTotal = defThrowActiveFrame + 25; // 硬直23F (全体30F)

            const atkThrowEndActive = throwHitFrame + 2;
            const atkThrowEndTotal = throwHitFrame + 25; // 着弾F + 持続2F + 硬直23F

            let outcome = {
                shortText: '',
                badgeClass: 'res-evade',
                detailMessage: '',
                detailColor: 'var(--color-shimmy)'
            };

            const atkCells = Array.from({ length: MAX_FRAMES + 1 }, () => ({ cls: '', txt: '' }));
            const defCells = Array.from({ length: MAX_FRAMES + 1 }, () => ({ cls: '', txt: '' }));

            // =========================================================
            // A. 攻撃側 = 投げ (throw)
            // =========================================================
            if (atkAction === 'throw') {
                if (isTech) {
                    if (defThrowActiveFrame < throwHitFrame) {
                        // 防御側の投げが攻撃側の遅らせ投げ着弾より先に発生 → 防御側の逆投げ勝ち
                        outcome = {
                            shortText: '🎉 逆投げ勝ち',
                            badgeClass: 'res-def-win',
                            detailMessage: `🎉 防御側の投げ（${defThrowActiveFrame}F目発生）が、相手の遅らせ投げ（${throwHitFrame}F目着弾）より先に決まった！`,
                            detailColor: 'var(--color-startup)'
                        };
                        for (let i = 1; i <= MAX_FRAMES; i++) {
                            if (i >= Math.max(1, throwHitFrame - 4) && i < defThrowActiveFrame) atkCells[i] = { cls: 'atk-throw-start', txt: '発' };
                            else if (i >= defThrowActiveFrame && i <= Math.min(MAX_FRAMES, defThrowActiveFrame + 12)) atkCells[i] = { cls: 'atk-punish', txt: '被' };

                            if (i < throwInputFrame) defCells[i] = { cls: 'def-guard-wait', txt: 'G' };
                            else if (i === throwInputFrame) defCells[i] = { cls: 'def-tech-window', txt: '入' };
                            else if (i < defThrowActiveFrame) defCells[i] = { cls: 'def-whiff-start', txt: '発' };
                            else if (i <= Math.min(MAX_FRAMES, defThrowActiveFrame + 12)) defCells[i] = { cls: 'atk-throw-active', txt: '投' };
                        }
                    } else if (throwInputFrame <= throwHitFrame + TECH_WINDOW) {
                        // 投げ抜け猶予内に入力 → 投げ抜け成立
                        const techF = Math.max(throwHitFrame, throwInputFrame);
                        outcome = {
                            shortText: '✨ 抜け成立',
                            badgeClass: 'res-tech',
                            detailMessage: `✨ 投げ抜け成功！ (${throwHitFrame}F目の被投げに対し、猶予内の${throwInputFrame}F目に入力してグラップ成立)`,
                            detailColor: 'var(--color-tech-window)'
                        };
                        for (let i = 1; i <= MAX_FRAMES; i++) {
                            if (i >= Math.max(1, throwHitFrame - 4) && i < throwHitFrame) atkCells[i] = { cls: 'atk-throw-start', txt: '発' };
                            else if (i >= throwHitFrame && i < techF) atkCells[i] = { cls: 'atk-throw-active', txt: '投' };
                            else if (i === techF) atkCells[i] = { cls: 'def-tech-window', txt: '抜' };

                            if (i < throwInputFrame && i < throwHitFrame) defCells[i] = { cls: 'def-guard-wait', txt: 'G' };
                            else if (i >= throwHitFrame && i < techF) defCells[i] = { cls: 'atk-punish', txt: '被' };
                            else if (i === techF) defCells[i] = { cls: 'def-tech-window', txt: '抜' };
                        }
                    } else {
                        // 投げ抜け入力が遅すぎて被弾
                        outcome = {
                            shortText: '💥 投げ被弾',
                            badgeClass: 'res-atk-win',
                            detailMessage: `💥 遅らせすぎ！ (${throwInputFrame}F目入力では${throwHitFrame}F目着弾の投げ抜け猶予に間に合わず被弾)`,
                            detailColor: 'var(--color-punish)'
                        };
                        for (let i = 1; i <= MAX_FRAMES; i++) {
                            if (i >= Math.max(1, throwHitFrame - 4) && i < throwHitFrame) atkCells[i] = { cls: 'atk-throw-start', txt: '発' };
                            else if (i >= throwHitFrame && i <= Math.min(MAX_FRAMES, throwHitFrame + 12)) atkCells[i] = { cls: 'atk-throw-active', txt: '投' };

                            if (i < throwHitFrame) defCells[i] = { cls: 'def-guard-wait', txt: 'G' };
                            else if (i <= Math.min(MAX_FRAMES, throwHitFrame + 12)) defCells[i] = { cls: 'atk-punish', txt: '被' };
                        }
                    }
                } else if (defKey === 'abare') {
                    if (abareHitFrame < throwHitFrame) {
                        outcome = {
                            shortText: '🎉 暴れ勝ち',
                            badgeClass: 'res-def-win',
                            detailMessage: `🎉 暴れ勝ち！ (相手の投げ着弾${throwHitFrame}F目より先に、発生${abareHitFrame}Fの打撃がカウンターヒット)`,
                            detailColor: 'var(--color-startup)'
                        };
                        for (let i = 1; i <= MAX_FRAMES; i++) {
                            if (i >= Math.max(1, throwHitFrame - 4) && i < abareHitFrame) atkCells[i] = { cls: 'atk-throw-start', txt: '発' };

            delayInputF.innerText = delayInputFrame;
            throwVal.innerText = throwHitFrame;
            strikeVal.innerText = strikeHitFrame;
            abareVal.innerText = abareHitFrame;
            shimmyVal.innerText = shimmyEvadeFrame;

            // 攻撃側のスライダー表示切替
            document.getElementById('throwTimingGroup').style.display = (atkAction === 'throw') ? 'flex' : 'none';
            document.getElementById('strikeTimingGroup').style.display = (atkAction === 'strike') ? 'flex' : 'none';
            document.getElementById('shimmyTimingGroup').style.display = (atkAction === 'shimmy') ? 'flex' : 'none';

            const params = { throwHitFrame, strikeHitFrame, shimmyEvadeFrame, delayInputFrame, abareHitFrame };

            const defTracks = [
                { key: 'tech-fast', label: `① 最速投げ抜け (1F)` },
                { key: 'tech-delay', label: `② 遅らせグラ (${delayInputFrame}F入)` },
                { key: 'abare', label: `③ 暴れ (${abareHitFrame}F発生)` },
                { key: 'guard', label: `④ ガード継続` },
                { key: 'backdash', label: `⑤ バクステ (23F)` }
            ];

            // 全5トラックのシミュレーション結果を取得
            const simResults = {};
            defTracks.forEach(tr => {
                simResults[tr.key] = simulatePair(atkAction, tr.key, params);
            });

            const focusedSim = simResults[focusedDef] || simResults['tech-delay'];

            // ── 1. マルチフレームメーター（6本）の描画 ──
            let html = '';

            // ヘッダー行 (1〜40F)
            html += `<div class="row-header">フレーム</div>`;
            for (let i = 1; i <= MAX_FRAMES; i++) {
                // 攻撃側が投げのとき、投げ抜け猶予期間 (throwHitFrame 〜 throwHitFrame + TECH_WINDOW) の列番号をハイライト
                const isTechWinCol = (atkAction === 'throw' && i >= throwHitFrame && i <= throwHitFrame + TECH_WINDOW);
                const colCls = isTechWinCol ? 'frame-header tech-win-col' : 'frame-header';
                const colTitle = isTechWinCol ? `title="${i}F目 (投げ抜け猶予期間)"` : '';
                html += `<div class="${colCls}" ${colTitle}>${i}</div>`;
            }
            html += `<div class="row-outcome" style="color:var(--text-muted);font-size:10px;cursor:default;">結果 (タップで切替)</div>`;

            // 攻撃側トラック (1本目)
            const atkLabel = atkAction === 'throw'
                ? `【攻撃】投げ (${throwHitFrame}F着)`
                : atkAction === 'strike'
                    ? `【攻撃】打撃 (${strikeHitFrame}F着)`
                    : `【攻撃】シミー (${shimmyEvadeFrame}F外)`;
            html += `<div class="row-header atk-row-label">${atkLabel}</div>`;
            for (let i = 1; i <= MAX_FRAMES; i++) {
                const c = focusedSim.atkCells[i];
                html += `<div class="cell ${c.cls}">${c.txt}</div>`;
            }
            html += `<div class="row-outcome" style="color:#fca5a5;font-size:10px;cursor:default;">対 ${defTracks.find(d => d.key === focusedDef)?.label.slice(0, 7) || ''}</div>`;

            // セパレーター
            html += `<div class="grid-separator"></div>`;

            // 防御側トラック (5本)
            defTracks.forEach(tr => {
                const sim = simResults[tr.key];
                const isActive = (tr.key === focusedDef);
                const labelCls = isActive ? 'row-header def-row-label active-track' : 'row-header def-row-label';
                const cellFocusCls = isActive ? 'focused-row-cell' : '';

                html += `<div class="${labelCls}" onclick="selectTrack('${tr.key}')">${tr.label}</div>`;
                for (let i = 1; i <= MAX_FRAMES; i++) {
                    const c = sim.defCells[i];
                    html += `<div class="cell clickable-cell ${c.cls} ${cellFocusCls}" onclick="selectTrack('${tr.key}')">${c.txt}</div>`;
                }
                html += `<div class="row-outcome ${sim.outcome.badgeClass}" onclick="selectTrack('${tr.key}')">${sim.outcome.shortText}</div>`;
            });

            grid.innerHTML = html;

            // ── 2. 結果詳細ボックスの更新 ──
            resultText.innerText = focusedSim.outcome.detailMessage;
            resultText.style.borderColor = focusedSim.outcome.detailColor;
            resultText.style.color = focusedSim.outcome.detailColor;

            // ── 3. マトリクス表の動的描画 ──
            const atkRows = [
                { key: 'throw', label: `設定投げ (着弾${throwHitFrame}F目)` },
                { key: 'strike', label: `設定打撃 (着弾${strikeHitFrame}F目)` },
                { key: 'shimmy', label: `設定シミー (${shimmyEvadeFrame}F目間合い外)` }
            ];

            let matHtml = `
                <thead>
                    <tr>
                        <th>攻撃側 \\ 防御側</th>
                        <th>① 最速投げ抜け (1F)</th>
                        <th style="color:var(--color-tech-window)">② 遅らせグラ (${delayValNum}F遅/${delayInputFrame}F入)</th>
                        <th>③ 暴れ (発生${abareHitFrame}F)</th>
                        <th>④ ガード継続</th>
                        <th>⑤ バクステ (全体23F)</th>
                    </tr>
                </thead>
                <tbody>
            `;

            atkRows.forEach(ar => {
                const isSelectedAtk = (ar.key === atkAction);
                matHtml += `<tr>`;
                matHtml += `<td style="${isSelectedAtk ? 'color:#fff;box-shadow:inset 3px 0 0 var(--accent);' : ''}">${ar.label}</td>`;
                defTracks.forEach(dt => {
                    const sim = (ar.key === atkAction) ? simResults[dt.key] : simulatePair(ar.key, dt.key, params);
                    const isSelectedCell = (ar.key === atkAction && dt.key === focusedDef);
                    const selCls = isSelectedCell ? 'selected-matrix-cell' : '';
                    matHtml += `<td onclick="applyMatrixSelection('${ar.key}', '${dt.key}')" class="${sim.outcome.badgeClass} interactive-cell ${selCls}">${sim.outcome.shortText}</td>`;
                });
                matHtml += `</tr>`;
            });

            matHtml += `</tbody>`;
            document.getElementById('matrixTable').innerHTML = matHtml;
        }

        function saveState() {
            try {
                sessionStorage.setItem('atkAction', atkActionSel.value);
                sessionStorage.setItem('defAction', defActionSel.value);
            } catch {}
        }

        atkActionSel.addEventListener('change', () => { saveState(); render(); });
        defActionSel.addEventListener('change', () => { saveState(); render(); });
        delaySlider.addEventListener('input', render);
        strikeSlider.addEventListener('input', render);
        throwSlider.addEventListener('input', render);
        abareSlider.addEventListener('input', render);
        shimmySlider.addEventListener('input', render);

        try {
            const savedAtk = sessionStorage.getItem('atkAction');
            const savedDef = sessionStorage.getItem('defAction');
            if (savedAtk) atkActionSel.value = savedAtk;
            if (savedDef) defActionSel.value = savedDef;
        } catch {}
        render();
    </script>
</body>
</html>
