<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#6366f1">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="SF6 Frames">
    <meta name="description" content="Street Fighter 6 フレームデータビューア - オフライン対応PWA">
    <title>SF6 Frame Data</title>
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icons/icon-512.png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            /* デジタル庁 Blue Default に基づくダークカラーテーマ */
            --bg-primary: #050b18;          /* 深みのあるダークブルーグレー */
            --bg-secondary: #0c152b;        /* カードなどの一段明るい背景 */
            --bg-card: rgba(12, 21, 43, 0.85);
            --bg-glass: rgba(52, 96, 251, 0.08); /* Primary Baseを透過した背景 */
            --border: rgba(112, 150, 248, 0.15); /* Primary Light の透過境界線 */
            --border-active: rgba(52, 96, 251, 0.5); /* Primary Base */
            
            --text-primary: #f8fafc;
            --text-secondary: #cbd5e1;
            --text-muted: #64748b;
            
            --accent: #3460FB;             /* Primary Base */
            --accent-glow: rgba(52, 96, 251, 0.25);
            
            /* アラート・優劣（彩度を抑えめにして目に優しく） */
            --positive: #34d399;           /* 明るいエメラルドグリーン（青背景と同化しない有利F） */
            --negative: #FE3939;           /* Alert / Warning (マイナス確反Fは赤) */
            --neutral: #eab308;            /* 黄色 */
            --safe-top: env(safe-area-inset-top);
            --safe-bottom: env(safe-area-inset-bottom);
            --safe-left: env(safe-area-inset-left);
            --safe-right: env(safe-area-inset-right);
        }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            min-height: 100dvh;
            line-height: 1.5;
            -webkit-text-size-adjust: 100%;
            padding-top: var(--safe-top);
            padding-left: var(--safe-left);
            padding-right: var(--safe-right);
        }

        /* ── Header ── */
        .header {
            background: linear-gradient(135deg, rgba(52, 96, 251, 0.08), rgba(12, 21, 43, 0.95));
            border-bottom: 1px solid var(--border);
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header-left h1 {
            font-size: 18px;
            font-weight: 800;
            background: linear-gradient(135deg, #7096F8, #c084fc);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
        }

        .header-badge {
            background: var(--accent);
            color: white;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 10px;
            font-weight: 700;
        }

        .header-right {
            display: flex;
            gap: 8px;
        }

        /* ── Buttons ── */
        .btn {
            padding: 6px 14px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: var(--bg-glass);
            color: var(--text-secondary);
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
            min-height: 44px;
            min-width: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn:hover {
            background: rgba(52, 96, 251, 0.15);
            color: var(--text-primary);
            border-color: var(--border-active);
        }

        .btn:active {
            transform: scale(0.96);
        }

        .btn-primary {
            background: var(--accent);
            color: white;
            border-color: var(--accent);
        }

        .btn-primary:hover {
            background: #254EDB;
            border-color: #254EDB;
        }

        /* ── Container ── */
        .container {
            max-width: 1800px;
            margin: 0 auto;
            padding: 16px;
        }

        /* ── Controls Panel ── */
        .controls-panel {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 16px;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        .controls-row {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            align-items: flex-end;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
            flex: 1;
            min-width: 120px;
        }

        .control-group label {
            font-size: 11px;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .select-input,
        .search-input {
            padding: 8px 12px;
            background: rgba(5, 11, 24, 0.8);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text-primary);
            font-size: 13px;
            font-family: inherit;
            width: 100%;
            min-height: 44px;
            transition: border-color 0.2s;
            -webkit-appearance: none;
        }

        .select-input:focus,
        .search-input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }

        .search-input::placeholder {
            color: var(--text-muted);
        }

        /* ── Advanced Controls (Accordion) ── */
        .advanced-controls {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease-out, opacity 0.2s;
            opacity: 0;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .advanced-controls.show {
            max-height: 1000px;
            opacity: 1;
            margin-top: 16px;
            border-top: 1px solid var(--border);
            padding-top: 16px;
        }

        /* ── Toggles ── */
        .toggles-section {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .toggles-section h4 {
            font-size: 11px;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .column-toggles-container {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .toggle-group {
            background: rgba(5, 11, 24, 0.4);
            border: 1px solid rgba(52, 96, 251, 0.08);
            border-radius: 8px;
            padding: 8px 12px;
        }

        .toggle-group-title {
            font-size: 9px;
            font-weight: 700;
            color: var(--accent);
            margin-bottom: 4px;
            text-transform: uppercase;
        }

        .toggle-group .checkbox-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 4px 10px;
        }

        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 11px;
            color: var(--text-secondary);
            cursor: pointer;
            white-space: nowrap;
            min-height: 32px;
            -webkit-tap-highlight-color: transparent;
        }

        .checkbox-label input[type="checkbox"] {
            accent-color: var(--accent);
            width: 16px;
            height: 16px;
        }

        /* ── Type Filter Chips ── */
        .type-chips {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .type-chip {
            padding: 4px 12px;
            border-radius: 16px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            border: 1px solid transparent;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            min-height: 36px;
            display: flex;
            align-items: center;
        }

        .type-chip.active {
            opacity: 1;
        }

        .type-chip.inactive {
            opacity: 0.35;
            filter: grayscale(0.5);
        }

        .type-chip[data-type="通常技"] {
            background: rgba(52, 96, 251, 0.12);
            color: #7096F8;
            border-color: rgba(52, 96, 251, 0.25);
        }

        .type-chip[data-type="特殊技"] {
            background: rgba(6, 182, 212, 0.12);
            color: #22d3ee;
            border-color: rgba(6, 182, 212, 0.25);
        }

        .type-chip[data-type="必殺技"] {
            background: rgba(249, 115, 22, 0.12);
            color: #fb923c;
            border-color: rgba(249, 115, 22, 0.25);
        }

        .type-chip[data-type="スーパーアーツ"] {
            background: rgba(236, 72, 153, 0.12);
            color: #f472b6;
            border-color: rgba(236, 72, 153, 0.25);
        }

        .type-chip[data-type="通常投げ"] {
            background: rgba(168, 85, 247, 0.12);
            color: #c084fc;
            border-color: rgba(168, 85, 247, 0.25);
        }

        .type-chip[data-type="共通システム"] {
            background: rgba(100, 116, 139, 0.12);
            color: #94a3b8;
            border-color: rgba(100, 116, 139, 0.25);
        }

        /* ── Added Chars Tags ── */
        .added-chars {
            margin-top: 10px;
        }

        .tags-list {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .tag {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 3px 10px;
            background: rgba(52, 96, 251, 0.1);
            border: 1px solid rgba(52, 96, 251, 0.2);
            border-radius: 16px;
            font-size: 11px;
            font-weight: 600;
            color: #a5b4fc;
        }

        .tag-close {
            cursor: pointer;
            color: var(--text-muted);
            font-size: 13px;
            line-height: 1;
            min-width: 24px;
            min-height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .tag-close:hover {
            color: var(--negative);
        }

        .hidden {
            display: none !important;
        }

        /* ── Table Container (Sticky & Scroll) ── */
        .table-container {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            overflow: auto;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            /* ヘッダーやコントロールパネルの高さを差し引き、画面内に収める */
            max-height: calc(100vh - 170px);
            max-height: calc(100dvh - 170px);
            position: relative;
            -webkit-overflow-scrolling: touch;
        }

        .frame-table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            font-size: 12px;
        }

        /* ── Sticky Header ── */
        .frame-table thead th {
            background: var(--bg-secondary);
            color: var(--text-muted);
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.3px;
            padding: 10px 8px;
            border-bottom: 2px solid var(--border);
            white-space: nowrap;
            position: sticky;
            top: 0;
            z-index: 30; /* 最前面 */
            text-align: center;
        }

        .frame-table tbody tr {
            transition: background 0.1s;
        }

        /* ゼブラストライプ */
        .frame-table tbody tr:nth-child(even) {
            background: rgba(52, 96, 251, 0.02);
        }

        .frame-table tbody tr:hover {
            background: rgba(52, 96, 251, 0.05) !important;
        }

        .frame-table td {
            padding: 8px;
            border-bottom: 1px solid rgba(112, 150, 248, 0.06);
            white-space: nowrap;
            color: var(--text-secondary);
            text-align: center;
        }

        /* ── Sticky Columns (キャラ名、技名) ── */
        /* ヘッダーの固定 */
        .frame-table th:nth-child(1) {
            position: sticky;
            left: 0;
            z-index: 40;
            background: var(--bg-secondary);
            width: 70px;
            min-width: 70px;
            max-width: 70px;
            border-right: 1px solid var(--border);
        }

        .frame-table th:nth-child(2) {
            position: sticky;
            left: 70px;
            z-index: 40;
            background: var(--bg-secondary);
            width: 180px;
            min-width: 180px;
            max-width: 180px;
            border-right: 1px solid var(--border);
        }

        /* ボディの固定列 */
        .frame-table td:nth-child(1) {
            position: sticky;
            left: 0;
            z-index: 20;
            background: var(--bg-primary);
            width: 70px;
            min-width: 70px;
            max-width: 70px;
            border-right: 1px solid var(--border);
            color: var(--text-muted);
            font-size: 11px;
            text-align: left;
        }

        .frame-table td:nth-child(2) {
            position: sticky;
            left: 70px;
            z-index: 20;
            background: var(--bg-primary);
            width: 180px;
            min-width: 180px;
            max-width: 180px;
            border-right: 1px solid var(--border);
            color: var(--text-primary);
            font-weight: 500;
            text-align: left;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* 偶数行の固定列背景色調整 */
        .frame-table tbody tr:nth-child(even) td:nth-child(1),
        .frame-table tbody tr:nth-child(even) td:nth-child(2) {
            background: #070e1e; /* 偶数行用の少し明るい背景 */
        }

        /* ホバー時の固定列背景色連動 */
        .frame-table tbody tr:hover td:nth-child(1),
        .frame-table tbody tr:hover td:nth-child(2) {
            background: #0a152d !important;
        }

        .frame-table td.col-wrap {
            white-space: normal;
            max-width: 200px;
            font-size: 10px;
            line-height: 1.3;
        }

        /* ── Type badges ── */
        .type-badge {
            padding: 2px 6px;
            border-radius: 8px;
            font-size: 9px;
            font-weight: 700;
            white-space: nowrap;
        }

        .type-badge.通常技 { background: rgba(52, 96, 251, 0.15); color: #818cf8; }
        .type-badge.特殊技 { background: rgba(6, 182, 212, 0.15); color: #22d3ee; }
        .type-badge.必殺技 { background: rgba(249, 115, 22, 0.15); color: #fb923c; }
        .type-badge.スーパーアーツ { background: rgba(236, 72, 153, 0.15); color: #f472b6; }
        .type-badge.通常投げ { background: rgba(168, 85, 247, 0.15); color: #c084fc; }
        .type-badge.共通システム { background: rgba(100, 116, 139, 0.15); color: #94a3b8; }

        /* ── Advantage Colors ── */
        .adv-positive { color: var(--positive) !important; font-weight: 600; }
        .adv-negative { color: var(--negative) !important; }
        .adv-zero { color: var(--neutral) !important; font-weight: 600; }

        /* ── Footer ── */
        .footer {
            text-align: center;
            padding: 16px;
            padding-bottom: calc(16px + var(--safe-bottom));
            color: var(--text-muted);
            font-size: 11px;
            border-top: 1px solid var(--border);
            margin-top: 16px;
        }

        /* ── Scrollbar ── */
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(52, 96, 251, 0.2); border-radius: 2px; }

        /* ── Mobile Responsive ── */
        @media (max-width: 768px) {
            .header { padding: 10px 12px; }
            .header-left h1 { font-size: 16px; }
            .container { padding: 8px; }
            .controls-panel { padding: 12px; border-radius: 10px; }
            .controls-row { flex-direction: column; gap: 8px; align-items: stretch; }
            .control-group { min-width: 100%; }
            .select-input, .search-input { font-size: 16px; } /* prevent iOS zoom */
            .frame-table { font-size: 11px; }
            .frame-table thead th { padding: 8px 6px; font-size: 9px; }
            .frame-table td { padding: 6px 4px; font-size: 11px; }
            .frame-table th:nth-child(1), .frame-table td:nth-child(1) { width: 50px; min-width: 50px; max-width: 50px; }
            .frame-table th:nth-child(2), .frame-table td:nth-child(2) { left: 50px; width: 120px; min-width: 120px; max-width: 120px; font-size: 11px; }
            .type-badge { font-size: 8px; padding: 1px 5px; }
            .table-container { border-radius: 10px; max-height: calc(100vh - 200px); max-height: calc(100dvh - 200px); }
            .toggle-group { padding: 6px 8px; }
        }

        /* ── Very small screens ── */
        @media (max-width: 380px) {
            .header-left h1 { font-size: 14px; }
            .frame-table { font-size: 10px; }
            .frame-table th:nth-child(1), .frame-table td:nth-child(1) { width: 40px; min-width: 40px; max-width: 40px; }
            .frame-table th:nth-child(2), .frame-table td:nth-child(2) { left: 40px; width: 100px; min-width: 100px; max-width: 100px; }
        }
    </style>
</head>

<body>
    <header class="header">
        <div class="header-left">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#818cf8" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <polygon points="5 3 19 3 22 12 19 21 5 21 2 12 5 3"></polygon>
            </svg>
            <h1>SF6 FRAME DATA</h1>
            <span class="header-badge" id="charCount">–</span>
        </div>
        <div class="header-right">
            <button class="btn" id="btn-add-char">＋</button>
            <button class="btn" id="btn-top" title="トップへ">↑</button>
        </div>
    </header>

    <main class="container">
        <section class="controls-panel">
            <div class="controls-row">
                <div class="control-group">
                    <label>キャラクター</label>
                    <select id="main-char-select" class="select-input"></select>
                </div>
                <div class="control-group">
                    <label>検索</label>
                    <input type="text" id="search-input" class="search-input" placeholder="技名 / コマンドで検索...">
                </div>
                <div class="control-group">
                    <label>並べ替え</label>
                    <select id="sort-select" class="select-input">
                        <option value="default">デフォルト</option>
                        <option value="damage">ダメージ</option>
                        <option value="startup">発生</option>
                        <option value="active">持続</option>
                        <option value="total">全体</option>
                        <option value="adv_guard">ガード硬直差</option>
                        <option value="adv_hit">ヒット硬直差</option>
                        <option value="adv_ch">カウンター硬直差</option>
                        <option value="adv_pc">パニカン硬直差</option>
                        <option value="d_hit">Dヒット</option>
                        <option value="d_guard">Dガード</option>
                        <option value="sa_gain">SA増加</option>
                    </select>
                </div>
                <div class="control-group">
                    <button class="btn" id="btn-toggle-advanced">設定・フィルター ＋</button>
                </div>
            </div>
            
            <!-- 折りたたみ可能な詳細設定エリア -->
            <div class="advanced-controls" id="advanced-controls">
                <div class="toggles-section">
                    <h4>技の種類</h4>
                    <div class="type-chips" id="type-chips"></div>
                </div>
                <div class="toggles-section">
                    <h4>表示する列</h4>
                    <div class="column-toggles-container" id="column-toggles"></div>
                </div>
            </div>

            <div id="added-chars-container" class="added-chars hidden">
                <h4 style="font-size:11px;font-weight:700;color:var(--text-muted);margin-bottom:8px;text-transform:uppercase;">比較中</h4>
                <div class="tags-list" id="added-chars-list"></div>
            </div>
        </section>

        <section class="table-container">
            <table id="frame-table" class="frame-table">
                <thead>
                    <tr id="table-header-row"></tr>
                </thead>
                <tbody id="table-body"></tbody>
            </table>
        </section>
    </main>

    <footer class="footer">SF6 Frame Data — PWA Edition</footer>

    <script src="official_data.js"></script>

    <script>
        // ── Service Worker Registration ──
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./sw.js').catch(() => {});
        }

        // ── キャラ名マップ ──
        const characterNames = {
            "ryu": "リュウ", "luke": "ルーク", "jamie": "ジェイミー", "chunli": "春麗",
            "guile": "ガイル", "kimberly": "キンバリー", "juri": "ジュリ", "ken": "ケン",
            "blanka": "ブランカ", "dhalsim": "ダルシム", "ehonda": "E.本田",
            "deejay": "ディージェイ", "manon": "マノン", "marisa": "マリーザ",
            "jp": "JP", "zangief": "ザンギエフ", "lily": "リリー", "cammy": "キャミィ",
            "rashid": "ラシード", "aki": "A.K.I.", "ed": "エド", "akuma": "豪鬼",
            "m_bison": "ベガ", "terry": "テリー", "mai": "舞", "elena": "エレナ",
            "sagat": "サガット", "cviper": "C.ヴァイパー", "alex": "アレックス",
        };

        // ── データパース ──
        const rawData = window.officialData || {};
        const characters = {};

        const addAdv = (base, add) => {
            if (base === undefined || base === null || base === '-' || base === '') return '-';
            const n = parseInt(String(base).trim());
            return isNaN(n) ? String(base).trim() : String(n + add);
        };
        const calcTotal = (s, a, r) => {
            const ns = parseInt(s), na = parseInt(a), nr = parseInt(r);
            return (!isNaN(ns) && !isNaN(na) && !isNaN(nr)) ? String(ns + na + nr - 1) : String(r || '-').trim();
        };

        Object.keys(rawData).forEach(key => {
            let charId = key.replace('_frame', '');
            if (charId === 'gouki_akuma') charId = 'akuma';
            if (charId === 'vega_mbison') charId = 'm_bison';
            const charName = characterNames[charId] || charId;
            const rawMoves = Array.isArray(rawData[key]) ? rawData[key] : [];
            if (rawMoves.length === 0) return;

            const moves = rawMoves.map(rm => {
                const name = rm.name || '-';
                const hit = rm.hit !== undefined ? rm.hit : '-';
                const block = rm.block !== undefined ? rm.block : '-';
                const startup = rm.startup || '-';
                let active = rm.active || '-';
                if (typeof active === 'string') {
                    active = active.replace(/(\d+)\s*-\s*(\d+)/g, '$1-$2');
                }
                const recovery = rm.recovery || '-';

                // キャプコン公式データ特有の持続表記対策 (例: "11-2911-13, 17-19, 26-29" -> "11-29"と後続の注釈に分離)
                let activeNote = '';
                const m = active.match(/^(\d+(?:-\d+)?)/);
                if (m) {
                    const baseStr = m[1]; // 例: "11-2911" まで最初に長くマッチしてしまうので調整
                    // 発生(startup)と同じ数字で始まる注釈がくっついているケースが多い (あるいは単純に持続の開始フレーム)
                    // 一旦正規表現ではなく、"-"で区切って文字列の妥当性を確認する
                    const hyphenIdx = active.indexOf('-');
                    if (hyphenIdx !== -1) {
                        // 次の - や , が来るまでの数字の塊を探す
                        const matchNext = active.substring(hyphenIdx + 1).match(/^\d+/);
                        if (matchNext) {
                            const endFrameStr = matchNext[0];
                            const extractedBase = active.substring(0, hyphenIdx + 1 + endFrameStr.length);
                            const remaining = active.substring(extractedBase.length);
                            
                            // "11-2911"のようになっていたら、"11-29"と"11"に分ける (大抵後ろの数字の桁数は2か1)
                            // remainingの先頭が数字(例:"-13")なら、extractedBaseの末尾の数字を削るかどうか判定
                            if (remaining && /^\s*-/.test(remaining) && extractedBase.length > 3) {
                                // "11-29" + "11" + "-13..." みたいなケース
                                const matchOverlap = extractedBase.match(/^(\d+-\d{1,2})(\d{1,2})$/);
                                if (matchOverlap) {
                                    active = matchOverlap[1];
                                    activeNote = matchOverlap[2] + remaining;
                                } else {
                                    active = extractedBase;
                                    activeNote = remaining;
                                }
                            } else if (remaining && /^\s*,/.test(remaining) && extractedBase.length > 3) {
                                // "13-4413" + ", 18..." みたいなケース
                                const matchOverlap = extractedBase.match(/^(\d+-\d{1,2})(\d{1,2})$/);
                                if (matchOverlap) {
                                    active = matchOverlap[1];
                                    activeNote = matchOverlap[2] + remaining;
                                } else {
                                    active = extractedBase;
                                    activeNote = remaining;
                                }
                            } else {
                                active = extractedBase;
                                activeNote = remaining;
                            }
                        }
                    } else {
                        // ハイフンがない場合 (例:"13")
                        const matchSolo = active.match(/^(\d+)/);
                        if (matchSolo) {
                            const extractedBase = matchSolo[1];
                            const remaining = active.substring(extractedBase.length);
                            active = extractedBase;
                            activeNote = remaining;
                        }
                    }
                }

                // 先頭や末尾の空白カンマなどを掃除
                activeNote = activeNote.replace(/^[\s,]+/, '').trim();
                if (activeNote) {
                    activeNote = `※持続内訳: ${activeNote}`;
                }

                let activeDisplay = active;
                let total = '-';
                const recMatch = String(recovery).match(/(\d+)/);
                const recNum = recMatch ? parseInt(recMatch[1]) : NaN;

                const mRange = active.match(/^(\d+)-(\d+)$/);
                if (mRange) {
                    const actStart = parseInt(mRange[1]);
                    const actEnd = parseInt(mRange[2]);
                    activeDisplay = String(actEnd - actStart + 1);
                    if (!isNaN(recNum)) {
                        total = String(actEnd + recNum);
                    }
                } else {
                    const actNum = parseInt(active);
                    if (!isNaN(actNum)) {
                        if (/^\d+$/.test(active)) {
                            activeDisplay = '1';
                        }
                        if (!isNaN(recNum)) {
                            total = String(actNum + recNum);
                        }
                    } else if (!isNaN(recNum)) {
                        total = String(recNum);
                    }
                }

                if (name.includes('ジャンプ')) total = '-';

                let adv_pc = addAdv(hit, 4);
                let notes = rm.notes || '-';
                
                // 「パニッシュカウンター時+XXF」表記から数値を抽出（備考欄のテキストはそのまま残す）
                const pcRegex = /(※?地上)?パニッシュカウンター[^、]*?([＋+]\s*\d+[Ff]?)/;
                const match = notes.match(pcRegex);
                if (match) {
                    let valStr = match[2].replace(/[＋+]\s*/, '+').replace(/[Ff]/, '');
                    adv_pc = valStr;
                }

                // 備考欄に持続内訳を追記
                if (activeNote) {
                    notes = notes === '-' ? activeNote : (notes + ' / ' + activeNote);
                }
                
                // ただし「膝崩れ」や「吹き飛びダウン」表記を含む場合はパニカン欄を無表記(-)にする
                if (notes.includes('パニッシュカウンター') && (notes.includes('膝崩れ') || notes.includes('膝くずれ') || notes.includes('吹き飛びダウン'))) {
                    adv_pc = '-';
                }

                return {
                    name, cmd_c: rm.cmd_c || '-', damage: rm.damage || '-',
                    startup, active: activeDisplay, total,
                    adv_guard: block, adv_hit: hit,
                    adv_ch: addAdv(hit, 2), adv_pc: adv_pc,
                    adv_dr_guard: addAdv(block, 4), adv_dr_hit: addAdv(hit, 4),
                    cancel: rm.cancel !== undefined ? rm.cancel : '-',
                    attr: rm.attr || '-', type: rm.type || '通常技',
                    d_hit: rm.d_hit || '-', d_guard: rm.d_guard || '-', d_pc: rm.d_pc || '-',
                    sa_gain: rm.sa_gain || '-', scaling: rm.scaling || '-', notes: notes,
                };
            });

            characters[charId] = { id: charId, name: charName, moves };
        });

        // ── Column Definitions ──
        const isMobile = window.innerWidth <= 768;
        const columnsDef = [
            { id: 'type', label: '種類', group: '基本', defaultOn: !isMobile, isType: true },
            { id: 'cmd_c', label: 'コマンド', group: '基本', defaultOn: true },
            { id: 'damage', label: 'ダメージ', group: '基本', defaultOn: true },
            { id: 'startup', label: '発生', group: 'フレーム', defaultOn: true },
            { id: 'active', label: '持続', group: 'フレーム', defaultOn: !isMobile },
            { id: 'total', label: '全体', group: 'フレーム', defaultOn: false },
            { id: 'adv_guard', label: 'ガード', group: '硬直差', defaultOn: true, isAdv: true },
            { id: 'adv_hit', label: 'ヒット', group: '硬直差', defaultOn: true, isAdv: true },
            { id: 'adv_ch', label: 'カウンター', group: '硬直差', defaultOn: !isMobile, isAdv: true },
            { id: 'adv_pc', label: 'パニカン', group: '硬直差', defaultOn: !isMobile, isAdv: true },
            { id: 'adv_dr_guard', label: 'Dガード', group: '硬直差', defaultOn: false, isAdv: true },
            { id: 'adv_dr_hit', label: 'Dヒット', group: '硬直差', defaultOn: false, isAdv: true },
            { id: 'cancel', label: 'キャンセル', group: '属性', defaultOn: !isMobile },
            { id: 'attr', label: '属性', group: '属性', defaultOn: !isMobile },
            { id: 'd_hit', label: 'Dヒット', group: 'ドライブ', defaultOn: false },
            { id: 'd_guard', label: 'Dガード', group: 'ドライブ', defaultOn: false },
            { id: 'd_pc', label: 'Dパニカン', group: 'ドライブ', defaultOn: false },
            { id: 'sa_gain', label: 'SA増加', group: 'SA', defaultOn: false },
            { id: 'scaling', label: '補正', group: '補正', defaultOn: false },
            { id: 'notes', label: '備考', group: '備考', defaultOn: !isMobile, isNotes: true },
        ];

        const moveTypes = ['通常技', '特殊技', '必殺技', 'スーパーアーツ', '通常投げ', '共通システム'];

        // ── State ──
        const savedState = (() => {
            try { return JSON.parse(localStorage.getItem('sf6_state')) || {}; } catch { return {}; }
        })();
        const state = {
            mainChar: savedState.mainChar || 'ed', addedChars: [], sortBy: 'default', searchQuery: '',
            visibleColumns: savedState.visibleColumns || {},
            visibleTypes: savedState.visibleTypes || ['通常技', '特殊技', '必殺技', 'スーパーアーツ', '通常投げ'],
        };
        if (Object.keys(state.visibleColumns).length === 0) {
            columnsDef.forEach(c => { state.visibleColumns[c.id] = c.defaultOn; });
        }

        const saveState = () => {
            try {
                localStorage.setItem('sf6_state', JSON.stringify({
                    mainChar: state.mainChar,
                    visibleColumns: state.visibleColumns,
                    visibleTypes: state.visibleTypes
                }));
            } catch {}
        };

        // ── Format helpers ──
        const formatAdv = (val) => {
            if (val === '-' || val === '' || val === undefined) return val || '-';
            const n = parseInt(val);
            return isNaN(n) ? val : (n > 0 ? `+${n}` : `${n}`);
        };
        const advClass = (val) => {
            if (val === '-' || val === '' || val === undefined) return '';
            const n = parseInt(val);
            if (isNaN(n)) return '';
            return n > 0 ? 'adv-positive' : n < 0 ? 'adv-negative' : 'adv-zero';
        };

        // ── Init ──
        document.addEventListener('DOMContentLoaded', () => {
            const charList = Object.values(characters).sort((a, b) => a.name.localeCompare(b.name, 'ja'));
            document.getElementById('charCount').textContent = `${charList.length}`;

            const sel = document.getElementById('main-char-select');
            sel.innerHTML = charList.map(c => `<option value="${c.id}">${c.name}</option>`).join('');
            if (characters[state.mainChar]) sel.value = state.mainChar;
            else if (charList.length > 0) { state.mainChar = charList[0].id; sel.value = state.mainChar; }

            initTypeChips();
            initColumnToggles();

            sel.addEventListener('change', (e) => { state.mainChar = e.target.value; saveState(); renderTable(); });
            document.getElementById('sort-select').addEventListener('change', (e) => { state.sortBy = e.target.value; renderTable(); });
            document.getElementById('column-toggles').addEventListener('change', (e) => {
                if (e.target.tagName === 'INPUT' && e.target.dataset.col) {
                    state.visibleColumns[e.target.dataset.col] = e.target.checked;
                    saveState();
                    renderTable();
                }
            });
            let t;
            document.getElementById('search-input').addEventListener('input', (e) => {
                clearTimeout(t);
                t = setTimeout(() => { state.searchQuery = e.target.value.trim().toLowerCase(); renderTable(); }, 150);
            });
            document.getElementById('btn-add-char').addEventListener('click', () => {
                const avail = charList.filter(c => c.id !== state.mainChar && !state.addedChars.includes(c.id));
                if (avail.length > 0) { state.addedChars.push(avail[0].id); renderAddedChars(); renderTable(); }
            });
            document.getElementById('btn-top').addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));

            // Advanced controls toggle
            const btnToggle = document.getElementById('btn-toggle-advanced');
            const advControls = document.getElementById('advanced-controls');
            btnToggle.addEventListener('click', () => {
                const isOpen = advControls.classList.toggle('show');
                btnToggle.textContent = isOpen ? '設定・フィルター －' : '設定・フィルター ＋';
                if (isOpen) {
                    btnToggle.classList.add('btn-primary');
                } else {
                    btnToggle.classList.remove('btn-primary');
                }
            });

            renderTable();
        });

        function initTypeChips() {
            const c = document.getElementById('type-chips');
            c.innerHTML = moveTypes.map(t => {
                const on = state.visibleTypes.includes(t);
                return `<span class="type-chip ${on ? 'active' : 'inactive'}" data-type="${t}">${t}</span>`;
            }).join('');
            c.addEventListener('click', (e) => {
                const chip = e.target.closest('.type-chip');
                if (!chip) return;
                const type = chip.dataset.type;
                if (state.visibleTypes.includes(type)) {
                    state.visibleTypes = state.visibleTypes.filter(t => t !== type);
                    chip.classList.replace('active', 'inactive');
                } else {
                    state.visibleTypes.push(type);
                    chip.classList.replace('inactive', 'active');
                }
                saveState();
                renderTable();
            });
        }

        function initColumnToggles() {
            const c = document.getElementById('column-toggles');
            const g = {};
            columnsDef.forEach(col => { (g[col.group] = g[col.group] || []).push(col); });
            let h = '';
            for (const gn in g) {
                h += `<div class="toggle-group"><h5 class="toggle-group-title">${gn}</h5><div class="checkbox-grid">`;
                h += g[gn].map(col => `<label class="checkbox-label"><input type="checkbox" data-col="${col.id}" ${state.visibleColumns[col.id] ? 'checked' : ''}> ${col.label}</label>`).join('');
                h += '</div></div>';
            }
            c.innerHTML = h;
        }

        function renderAddedChars() {
            const container = document.getElementById('added-chars-container');
            const list = document.getElementById('added-chars-list');
            if (state.addedChars.length === 0) { container.classList.add('hidden'); return; }
            container.classList.remove('hidden');
            list.innerHTML = state.addedChars.map(id => {
                const ch = characters[id];
                return `<span class="tag">${ch ? ch.name : id}<span class="tag-close" data-id="${id}">×</span></span>`;
            }).join('');
            list.querySelectorAll('.tag-close').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    state.addedChars = state.addedChars.filter(id => id !== e.target.dataset.id);
                    renderAddedChars();
                    renderTable();
                });
            });
        }

        function renderTable() {
            const headerRow = document.getElementById('table-header-row');
            const tbody = document.getElementById('table-body');
            const activeCols = columnsDef.filter(c => state.visibleColumns[c.id]);

            let th = '<th>キャラ</th><th>技名</th>';
            activeCols.forEach(col => { th += `<th>${col.label}</th>`; });
            headerRow.innerHTML = th;

            let allMoves = [];
            [state.mainChar, ...state.addedChars].forEach(charId => {
                const cd = characters[charId];
                if (!cd) return;
                cd.moves.forEach((move, idx) => {
                    if (!state.visibleTypes.includes(move.type)) return;
                    if (state.searchQuery && !move.name.toLowerCase().includes(state.searchQuery) && !(move.cmd_c || '').toLowerCase().includes(state.searchQuery)) return;
                    allMoves.push({ charName: cd.name, ...move, _idx: idx });
                });
            });

            if (state.sortBy !== 'default') {
                const pv = (v) => { if (v == null || v === '-' || v === '') return null; const m = String(v).trim().match(/^(-?\d+)/); return m ? parseInt(m[1]) : null; };
                allMoves.sort((a, b) => {
                    let va = pv(a[state.sortBy]), vb = pv(b[state.sortBy]);
                    if (va === null && vb === null) return 0;
                    if (va === null) return 1;
                    if (vb === null) return -1;
                    return ['startup', 'active', 'total'].includes(state.sortBy) ? va - vb : vb - va;
                });
            }

            if (allMoves.length === 0) {
                tbody.innerHTML = `<tr><td colspan="${activeCols.length + 2}" style="text-align:center;padding:40px;color:var(--text-muted);">該当する技がありません</td></tr>`;
                return;
            }

            let html = '';
            allMoves.forEach(move => {
                html += '<tr>';
                html += `<td class="col-char-name">${move.charName}</td>`;
                html += `<td class="col-name">${move.name}</td>`;
                activeCols.forEach(col => {
                    let val = move[col.id] !== undefined ? move[col.id] : '-';
                    let cls = '', display = val;
                    if (col.isAdv) { display = formatAdv(val); cls = advClass(val); }
                    else if (col.isType) { display = `<span class="type-badge ${val}">${val}</span>`; }
                    else if (col.isNotes) { cls = 'col-wrap'; if (typeof display === 'string') display = display.replace(/、 /g, '<br>'); }
                    html += `<td class="${cls}">${display}</td>`;
                });
                html += '</tr>';
            });
            tbody.innerHTML = html;
        }
    </script>
</body>

</html>
